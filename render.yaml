# Render Blueprint: New → Blueprint → pick this repository. Render builds the Dockerfile.
# All data lives in PostgreSQL (e.g. a free Neon database), so the free instance type works and nothing is lost
# when it sleeps or redeploys.
services:
  - type: web
    name: assignai
    runtime: docker
    plan: free
    healthCheckPath: /login
    envVars:
      # PostgreSQL connection string, e.g. from https://neon.tech
      - key: DATABASE_URL
        sync: false
      # Set ONE AI key in the Render dashboard (or neither, for offline mode).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SEED_FACULTY_EMAIL
        sync: false
      - key: SEED_FACULTY_NAME
        value: Faculty Admin
      - key: SEED_FACULTY_PASSWORD
        sync: false
